<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kilroy Vote</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  /* Lobby */
  #lobby {
    text-align: center;
    padding: 40px;
  }
  #lobby h1 {
    font-size: 2rem;
    margin-bottom: 24px;
    color: #e94560;
  }
  #lobby input {
    padding: 12px 20px;
    font-size: 1.1rem;
    border: 2px solid #e94560;
    border-radius: 8px;
    background: #16213e;
    color: #e0e0e0;
    outline: none;
    width: 260px;
  }
  #lobby input::placeholder { color: #666; }
  #lobby button {
    display: block;
    margin: 20px auto 0;
    padding: 12px 36px;
    font-size: 1.1rem;
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  #lobby button:hover { background: #c73850; }
  #lobby button:disabled, #buttons button:disabled { opacity: 0.45; cursor: not-allowed; }
  .status { margin-top: 16px; font-size: 0.9rem; color: #a0a0c0; }
  .status.error { color: #ff7a8a; }

  /* Voting UI */
  #voting {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  #voting h2 {
    font-size: 1.2rem;
    color: #a0a0c0;
  }
  #display-area {
    width: 384px;
    height: 384px;
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-y: auto;
  }
  #display-area .vote-msg {
    text-align: center;
    font-size: 1.1rem;
    color: #e0e0e0;
    margin: 6px 0;
    padding: 8px 16px;
    border-radius: 6px;
    background: rgba(233, 69, 96, 0.1);
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #buttons {
    display: flex;
    gap: 24px;
  }
  #buttons button {
    padding: 16px 48px;
    font-size: 1.3rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  #buttons button:active { transform: scale(0.96); }
  #btn-yes {
    background: #22c55e;
    color: #fff;
    box-shadow: 0 4px 14px rgba(34,197,94,0.4);
  }
  #btn-yes:hover { background: #1ba34e; }
  #btn-no {
    background: #ef4444;
    color: #fff;
    box-shadow: 0 4px 14px rgba(239,68,68,0.4);
  }
  #btn-no:hover { background: #dc2626; }
</style>
</head>
<body>

<!-- Lobby -->
<div id="lobby">
  <h1>🗳️ Kilroy Vote</h1>
  <input id="name-input" type="text" placeholder="Enter your name" maxlength="30" autofocus>
  <button id="join-btn" disabled>Join Vote</button>
  <p id="lobby-status" class="status" role="status">Connecting...</p>
</div>

<!-- Voting Screen -->
<div id="voting" class="voting-container">
  <h2 id="welcome-msg"></h2>
  <div id="display-area">
    <div class="placeholder" style="color:#666;">Waiting for votes…</div>
  </div>
  <div id="buttons">
    <button id="btn-yes">Yes</button>
    <button id="btn-no">No</button>
  </div>
  <p id="vote-status" class="status" role="status"></p>
</div>

<script type="module">
  import { initWebWidget } from '/apps/kilroy.utils/lib/kilroy/js/webwidget_sdk.js';

  const PREFIX = '/ww.vote ';
  const FILTERS = ['^/ww\\.vote '];
  const MAX_TEXT = 200;

  const nameInput = document.getElementById('name-input');
  const joinBtn = document.getElementById('join-btn');
  const lobbyStatus = document.getElementById('lobby-status');
  const voteStatus = document.getElementById('vote-status');
  const yesBtn = document.getElementById('btn-yes');
  const noBtn = document.getElementById('btn-no');

  const params = new URLSearchParams(window.location.search);
  const alias = (params.get('alias') || '').trim();
  const groupName = (params.get('group_name') || '').trim();

  let sdk = null;
  let userName = '';
  let connected = false;
  let ready = false;
  let closed = false;
  const subscriptions = [];

  function setStatus(text, isError = false) {
    for (const el of [lobbyStatus, voteStatus]) {
      el.textContent = text;
      el.classList.toggle('error', isError);
    }
  }

  function updateControls() {
    const live = !closed && ready && connected;
    joinBtn.disabled = !live;
    yesBtn.disabled = !live || !userName;
    noBtn.disabled = !live || !userName;
  }

  function enterLobby() {
    const name = nameInput.value.trim().slice(0, 30);
    if (!name) { nameInput.focus(); return; }
    if (joinBtn.disabled) return;
    userName = name;
    document.getElementById('lobby').style.display = 'none';
    document.getElementById('voting').style.display = 'flex';
    document.getElementById('welcome-msg').textContent = 'Voting as: ' + userName;
    updateControls();
  }

  async function sendVote(choice) {
    if (!sdk || !userName || yesBtn.disabled) return;
    try {
      await sdk.sendMessage(`${PREFIX}${userName} votes ${choice}`, { username: userName, type: 'text/plain' });
      addVoteMessage(`${userName} votes ${choice}`);
      setStatus('');
    } catch (err) {
      setStatus('Vote failed to send: ' + (err?.message || err), true);
    }
  }

  function handleIncoming(event) {
    if (closed || typeof event.message !== 'string' || !event.message.startsWith(PREFIX)) return;
    const body = event.message.slice(PREFIX.length).trim();
    if (!body) return;
    addVoteMessage(body.slice(0, MAX_TEXT));
  }

  function addVoteMessage(text) {
    const area = document.getElementById('display-area');
    area.querySelector('.placeholder')?.remove();
    const div = document.createElement('div');
    div.className = 'vote-msg';
    div.textContent = text;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  function closeWidget() {
    if (closed) return;
    closed = true;
    ready = false;
    subscriptions.forEach(unsubscribe => unsubscribe());
    if (sdk) sdk.disconnect();
    setStatus('Closed');
    updateControls();
  }

  joinBtn.addEventListener('click', enterLobby);
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') enterLobby(); });
  yesBtn.addEventListener('click', () => sendVote('yes'));
  noBtn.addEventListener('click', () => sendVote('no'));
  window.addEventListener('pagehide', event => { if (!event.persisted) closeWidget(); });

  async function init() {
    if (!alias || !groupName) {
      setStatus('Configuration error: this widget must be launched by Kilroy (missing alias or group_name).', true);
      updateControls();
      return;
    }
    try {
      sdk = initWebWidget({ focusBridgeEnabled: true, targetOrigin: window.location.origin });
      connected = sdk.connected;
      subscriptions.push(sdk.onConnectionState(event => {
        connected = !!event.connected;
        if (ready) setStatus(connected ? '' : 'Disconnected', !connected);
        updateControls();
      }));
      subscriptions.push(sdk.onMessage(handleIncoming));
      subscriptions.push(sdk.onLifecycle(({ event }) => { if (event === 'WIDGET_CLOSING') closeWidget(); }));
      await sdk.ready;
      await sdk.setMessageFilters(FILTERS);
      if (closed) return;
      connected = sdk.connected;
      ready = true;
      setStatus(connected ? '' : 'Disconnected', !connected);
    } catch (err) {
      setStatus('Initialization failed: ' + (err?.message || err), true);
    }
    updateControls();
  }

  init();
</script>
</body>
</html>
